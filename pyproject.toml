[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "binharic"
version = "0.3.0"
description = "Real-time speech to binary / hex / binharic (Mechanicus scrapcode) audio, and back"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.22", "sounddevice>=0.4", "rich>=12"]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
vosk = ["vosk>=0.3.45"]
all = ["faster-whisper>=1.0", "vosk>=0.3.45"]
# NVIDIA GPU: CUDA 12 cuBLAS + cuDNN 9 for CTranslate2 (loaded by binharic.gpu)
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]
test = ["pytest"]

[project.scripts]
binharic = "binharic.cli:main"

[tool.setuptools]
packages = ["binharic"]
