[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "binharic"
version = "0.1.0"
description = "Real-time speech to binary / hex / binharic (Mechanicus scrapcode) audio, and back"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.22", "sounddevice>=0.4"]

[project.optional-dependencies]
speech = ["vosk>=0.3.45"]
test = ["pytest"]

[project.scripts]
binharic = "binharic.cli:main"

[tool.setuptools]
packages = ["binharic"]
